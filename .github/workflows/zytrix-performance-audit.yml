name: Temporary production performance audit
on:
  push:
    branches: [validation/home-performance-20261007]
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 665bc593369318512a68ce264e2218b090c32bd7
      - name: Verify source and build
        run: |
          npm test
          npm run check
          npm run build
      - name: Prepare Chromium and Lighthouse
        run: |
          node --version
          google-chrome --version
          npm install --prefix /tmp/zytrix-audit lighthouse@13.5.0
      - name: Warm public catalogue cache
        run: |
          curl --fail --silent --output /dev/null --dump-header - https://zytrix-lives.vercel.app/api/home-lives
          curl --fail --silent --output /dev/null --dump-header - https://zytrix-lives.vercel.app/api/home-lives
      - name: Measure production mobile twice and desktop
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          for mode in mobile-1 mobile-2 desktop; do
            args=()
            if [ "$mode" = desktop ]; then args+=(--preset=desktop); fi
            /tmp/zytrix-audit/node_modules/.bin/lighthouse https://zytrix-lives.vercel.app/ "${args[@]}" --chrome-flags="--headless --no-sandbox --disable-gpu" --quiet --output=json --output-path="$mode.json"
            REPORT="$mode.json" node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.REPORT));
          const metrics={report:process.env.REPORT,url:r.finalDisplayedUrl,time:r.fetchTime,lighthouse:r.lighthouseVersion};
          for (const [id,c] of Object.entries(r.categories)) metrics[id]=Math.round(c.score*100);
          for (const id of ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index']) metrics[id]=r.audits[id].numericValue;
          console.log('ZYTRIX_METRICS '+JSON.stringify(metrics));
          const requests=r.audits['network-requests'].details.items.filter(x=>x.url.includes('/api/home-lives'));
          console.log('ZYTRIX_CATALOGUE '+JSON.stringify(requests.map(x=>({url:x.url,status:x.statusCode,start:x.networkRequestTime,end:x.networkEndTime,transfer:x.transferSize}))));
          for(const id of ['lcp-breakdown-insight','lcp-discovery-insight','errors-in-console']) {const a=r.audits[id];if(a)console.log('ZYTRIX_AUDIT '+JSON.stringify({id,score:a.score,details:a.details}));}
          NODE
          done
      - name: Try official PageSpeed API
        continue-on-error: true
        run: |
          curl --max-time 180 --silent 'https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https%3A%2F%2Fzytrix-lives.vercel.app%2F&strategy=mobile&category=performance&category=accessibility&category=best-practices&category=seo' > pagespeed-mobile.json
          node <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('pagespeed-mobile.json'));
          if(r.error)console.log('ZYTRIX_PAGESPEED_API '+JSON.stringify(r.error));
          else {const l=r.lighthouseResult;console.log('ZYTRIX_PAGESPEED_API '+JSON.stringify({categories:Object.fromEntries(Object.entries(l.categories).map(([k,v])=>[k,v.score*100])),LCP:l.audits['largest-contentful-paint'].numericValue,CLS:l.audits['cumulative-layout-shift'].numericValue,TBT:l.audits['total-blocking-time'].numericValue}));}
          NODE
      - name: Save full reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zytrix-lighthouse-20261007
          path: "*.json"
          retention-days: 7
