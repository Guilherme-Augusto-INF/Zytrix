name: Export Vercel Site

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.webmanifest"
      - "llms.txt"
      - "favicon.svg"
      - "robots.txt"
      - "sitemap.xml"
      - "vercel.json"
      - "assets/css/**"
      - "assets/js/**"
      - ".github/workflows/export-vercel-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar arquivos de deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/assets/css export/assets/js

          # Toda página HTML de nível raiz faz parte do site exportado.
          # Arquivos públicos de descoberta também entram no pacote.
          cp ./*.html export/
          cp favicon.svg robots.txt sitemap.xml vercel.json llms.txt site.webmanifest export/
          cp assets/css/*.css export/assets/css/
          cp assets/js/*.js export/assets/js/

          test -f export/index.html
          test -f export/favicon.svg
          test -f export/robots.txt
          test -f export/sitemap.xml
          test -f export/llms.txt
          test -f export/site.webmanifest
          test -f export/live.html
          test -f export/explorar.html
          test -f export/clips.html
          test -f export/creator-center.html
          test -f export/status.html
          test -f export/roadmap.html
          test -f export/assets/js/live-extras.js
          test -f export/assets/js/platform-core.js
          test -f export/assets/css/platform.css

      - name: Upload do pacote
        uses: actions/upload-artifact@v4
        with:
          name: zytrix-vercel-site
          path: export
          if-no-files-found: error
          retention-days: 1
